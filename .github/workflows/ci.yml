name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show runtimes
        run: |
          python3 --version
          node --version
      - name: Static checks
        run: npm run check
      - name: Tests
        run: npm test
